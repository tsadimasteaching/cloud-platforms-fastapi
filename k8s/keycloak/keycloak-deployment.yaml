apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels:
    app: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
      - name: keycloak
        image: 'quay.io/keycloak/keycloak:24.0'
        args:  ["start-dev"]
        ports:
        - containerPort: 8080
        env:
        - name: KC_DB_URL_HOST
          value: postgres-svc
        - name: KC_DB
          value: postgres
        - name: DB_DATABASE
          value: dbkeycloak
        - name: KC_DB_SCHEMA
          value: public
        - name: KC_DB_URL_DATABASE
          value: keycloak
        - name: KC_DB_PASSWORD
          value: admin123
        - name: KEYCLOAK_ADMIN
          value: admin
        - name: KEYCLOAK_ADMIN_PASSWORD
          value: admin
        - name: KC_HOSTNAME
          value: tsadimas-sso.ddns.net
        - name: KC_DB_USERNAME
          value: postgres
        - name: KC_PROXY
          value: edge
        - name: KC_HOSTNAME_ADMIN
          value: tsadimas-sso.ddns.net